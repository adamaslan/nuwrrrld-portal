language: "en-US"
early_access: false

tone_instructions: >-
  This is a Next.js portal with Clerk auth, Stripe billing, and a Neon
  Postgres backend. Prioritize security and correctness findings over style.

reviews:
  profile: "chill"
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/.vercel/**"
    - "!**/dist/**"
    - "!**/*.lock"
    - "!docs/archive/**"

  # Recurring defect classes this repo's PRs actually get flagged for and have
  # to fix. Keep in sync with the security checklist in the /geepr and /pr
  # command templates — that checklist and this config should describe the
  # same invariants from two angles (pre-flight vs. post-flight).
  path_instructions:
    - path: "**/*.{ts,tsx}"
      instructions: >-
        Flag any secret-shaped value (API key, Clerk secret key, Stripe
        `sk_live_*`/`sk_test_*`, database URL, webhook signing secret)
        assigned to or read through a `NEXT_PUBLIC_*` env var — that prefix
        ships to the client bundle. Flag any backend/internal service URL
        exposed via `NEXT_PUBLIC_*` instead of a server-only env var. A
        server-only module may intentionally read a public value; flag only
        actual secrets, internal endpoints, or genuine server-client boundary
        violations, not the prefix alone.

    - path: "app/api/**/*.{ts,tsx}"
      instructions: >-
        Flag any Stripe webhook handler that doesn't verify the signature
        (via `svix`/Stripe's signature verification) before trusting the
        request body. Flag any route handler that trusts a client-supplied
        user/org identifier without checking it against the authenticated
        Clerk session — the session, not the request body, is the source of
        truth for "who is making this call."

    - path: "lib/shared/**"
      instructions: >-
        This directory holds two distinct classes of file, tracked in
        docs/wiki-portal/concept-mobile-web-parity.md: (1) files actually
        mirrored byte-identical with `gcp3-mobile/lib/` (e.g. signal-policy.ts,
        live-price.ts) — flag ANY change to one of these that isn't the
        declared base-URL seam, since drift there is a cross-repo bug. (2)
        portal-only pure modules with no mobile counterpart (e.g.
        paper-policy.ts, followed-tickers-policy.ts, universe-policy.ts,
        card-policy.ts, portfolio-health-policy.ts) — these are a deliberate,
        long-standing pattern (the wiki tracks ~19 such modules vs. mobile's
        5) and are NOT a bug; do not suggest moving one out of lib/shared/
        just because it lacks a mobile counterpart today. When unsure which
        class a file is in, check whether an identical file exists under
        `gcp3-mobile/lib/` before flagging drift.

  auto_review:
    enabled: true
    drafts: false

chat:
  allow_non_org_members: false
  auto_reply: true
