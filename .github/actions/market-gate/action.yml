name: NYSE trading-day check
description: ET weekday and Alpaca holiday/session gate. Missing or invalid calendar data fails closed.
inputs:
  alpaca-key:
    description: Alpaca paper calendar key
    required: true
  alpaca-secret:
    description: Alpaca paper calendar secret
    required: true
  date:
    description: YYYY-MM-DD; empty means today in America/New_York
    default: ''
outputs:
  latest_completed_session:
    description: Most recent confirmed session completed as of the current ET clock
    value: ${{ steps.cal.outputs.latest_completed_session }}
  is_trading_day:
    description: Whether the calendar confirms an ET trading day
    value: ${{ steps.cal.outputs.is_trading_day }}
  open:
    description: Session open in ET
    value: ${{ steps.cal.outputs.open }}
  close:
    description: Session close in ET (including early closes)
    value: ${{ steps.cal.outputs.close }}
  session_open:
    description: Whether the ET wall clock is within the confirmed session
    value: ${{ steps.cal.outputs.session_open }}
  source:
    description: alpaca or unavailable (fails closed)
    value: ${{ steps.cal.outputs.source }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - id: cal
      shell: bash
      env:
        APCA_KEY: ${{ inputs.alpaca-key }}
        APCA_SECRET: ${{ inputs.alpaca-secret }}
        IN_DATE: ${{ inputs.date }}
      run: node "$GITHUB_ACTION_PATH/gate.mjs" calendar
