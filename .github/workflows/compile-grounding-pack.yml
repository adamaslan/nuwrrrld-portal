name: Compile grounding pack

# Daily, plus on any corpus edit and manual trigger. Runs
# scripts/compile_grounding_pack.mjs against the Neon database. The compile
# is incremental (unchanged chunks are skipped by content hash) and budgeted
# (--max-calls, default 40/day), so a no-change day costs zero model calls and
# a large corpus import finishes over several days, resuming each run.
on:
  schedule:
    - cron: '23 6 * * *' # daily 06:23 UTC (after the free-model refresh at 06:17)
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - 'scripts/compile_grounding_pack.mjs'
      - 'scripts/grounding-chunker.mjs'
  workflow_dispatch: {}

# One compile at a time: overlapping runs (cron + corpus push + manual) would
# each get their own --max-calls budget and can race on the same chunks.
concurrency:
  group: compile-grounding-pack
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # compile_grounding_pack.mjs imports @neondatabase/serverless. Without an
      # install every run died with ERR_MODULE_NOT_FOUND (daily since 2026-10-03).
      - name: Install dependencies
        run: npm ci

      # Fail with a one-line cause if the install ever stops providing the
      # driver, instead of a stack trace from inside the script.
      - name: Verify the database driver resolves
        run: node -e "import('@neondatabase/serverless').then(() => console.log('deps ok'))"

      - name: Compile grounding_pack from corpus/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/compile_grounding_pack.mjs

  # ── Notify on failure ──────────────────────────────────────────────────
  # Only for the scheduled cron: a push-triggered failure already shows up in
  # the PR/commit checks, but a broken *scheduled* compile means grounding
  # silently stops refreshing (it runs right after the free-model refresh,
  # so a chain change can break it).
  notify:
    name: Failure or recovery notification
    needs: [compile]
    if: always() && !cancelled() && github.event_name == 'schedule' && (failure() || (needs.compile.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Update pipeline alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'recovery' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export ISSUE_TITLE="Scheduled grounding-pack compile failed"
          export ISSUE_BODY="**Run:** ${RUN_URL}

          The scheduled grounding-pack compile failed or completed with extraction errors.
          Check this run's logs for the exact outcome and counts. Failed extraction chunks
          are skipped so their existing rows stay intact; setup or database failures may
          prevent any table writes."
          bash scripts/upsert-workflow-failure-issue.sh
