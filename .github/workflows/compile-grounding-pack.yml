name: Compile grounding pack

# Weekly, plus on any corpus edit and manual trigger. Runs
# scripts/compile_grounding_pack.mjs against the Neon database — the
# extraction is idempotent (ON CONFLICT upserts), so re-runs are safe.
on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC (after the free-model refresh at 06:17)
  push:
    branches: [main]
    paths:
      - 'corpus/**'
      - 'scripts/compile_grounding_pack.mjs'
      - 'scripts/grounding-chunker.mjs'
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile grounding_pack from corpus/
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/compile_grounding_pack.mjs

  # ── Notify on failure ──────────────────────────────────────────────────
  # Only for the weekly cron: a push-triggered failure already shows up in
  # the PR/commit checks, but a broken *scheduled* compile means grounding
  # silently stops refreshing (it runs right after the free-model refresh,
  # so a chain change can break it).
  notify:
    name: Failure notification
    needs: [compile]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Weekly grounding-pack compile failed $(date -u '+%Y-%m-%d')" \
            --body "**Run:** ${RUN_URL}

          \`scripts/compile_grounding_pack.mjs\` failed on the Monday 06:23 UTC
          schedule. The \`grounding_pack\` table was not refreshed; the corpus a
          model reads is now whatever the last successful run left." \
            --label "pipeline-failure"
