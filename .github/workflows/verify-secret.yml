name: Verify Secret Shape
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report shape only (never the value)
        env:
          PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SK: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          echo "PK length: ${#PK}"
          echo "PK prefix: ${PK:0:8}"
          echo "PK has whitespace: $(case "$PK" in *[[:space:]]*) echo YES;; *) echo NO;; esac)"
          echo "SK length: ${#SK}"
          echo "SK prefix: ${SK:0:8}"
