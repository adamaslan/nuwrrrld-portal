name: Verify Secret Shape
on:
  push:
    branches: [feat/playwright-e2e-suite]
    paths: ['.github/workflows/verify-secret.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report shape only (never the value)
        env:
          PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          SK: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          echo "PKLEN=${#PK}"
          echo "PKPRE=${PK:0:8}"
          echo "PKWS=$(case "$PK" in *[[:space:]]*) echo YES;; *) echo NO;; esac)"
          echo "SKLEN=${#SK}"
          echo "SKPRE=${SK:0:8}"

