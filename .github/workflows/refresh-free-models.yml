name: Refresh free model chain

# Weekly, plus manual trigger. Rewrites FREE_MODEL_CHAIN with models that are
# both $0-priced on OpenRouter and pass a live probe, then opens a PR if the
# list changed. Merge the PR to redeploy on Vercel.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize the full run, including alerts, so failure/recovery cannot race.
concurrency:
  group: refresh-free-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Write scopes only on the job that opens the chain PR (zizmor excessive-permissions).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh FREE_MODEL_CHAIN
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_CHAIN_SIZE: '4'
        # Exit 3 = the chain was refreshed fine but a SEAT_MODELS id is retired.
        # That is a degraded council, not a broken one, and it must NOT stop the
        # PR step below — a dead RISK seat blocking every weekly refresh is
        # exactly the failure this handling fixes (P1). Any other non-zero exit
        # (1 = catalog unreachable / too few working models) still fails the job.
        run: |
          set +e
          # Keep the log so the PR body can cite the probe evidence (see "Prepare PR body").
          node scripts/refresh-free-models.mjs > "$RUNNER_TEMP/refresh.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/refresh.log"
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 3 ]; then
            echo "::warning title=SEAT_MODELS has a retired id::Chain refreshed; a seat model no longer exists. Repoint SEAT_MODELS in lib/openrouter.ts. Continuing so the chain PR still opens."
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            echo "::error title=OpenRouter key rejected::OPENROUTER_API_KEY was refused (401/403). Rotate the repo secret, then re-run. Chain left untouched."
            exit 4
          fi
          echo "::error title=refresh-free-models failed::Exited $code — chain left untouched."
          exit "$code"

      - name: Describe the chain change
        id: chain
        run: |
          git show HEAD:lib/openrouter.ts > "$RUNNER_TEMP/previous-openrouter.ts"
          node scripts/free-model-chain.mjs "$RUNNER_TEMP/previous-openrouter.ts" lib/openrouter.ts > "$RUNNER_TEMP/chain-diff.json"
          {
            echo "changed=$(jq -r '.changed' "$RUNNER_TEMP/chain-diff.json")"
            echo "added=$(jq -r '.added | join(", ")' "$RUNNER_TEMP/chain-diff.json")"
            echo "removed=$(jq -r '.removed | join(", ")' "$RUNNER_TEMP/chain-diff.json")"
            echo "chain=$(jq -r '.chain | join(", ")' "$RUNNER_TEMP/chain-diff.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare PR body
        env:
          CHAIN_CHANGED: ${{ steps.chain.outputs.changed }}
        run: |
          {
            echo "Automated weekly refresh of \`FREE_MODEL_CHAIN\` in \`lib/openrouter.ts\`."
            echo
            echo "Each listed model is both **\$0-priced** on OpenRouter and passed a **live probe** (returned 200, not 402/429) at refresh time."
            echo
            echo "**Probe evidence** (from the refresh run log):"
            echo
            echo '```'
            grep -E '^  (probe|cap|Selected)' "$RUNNER_TEMP/refresh.log" || echo "(no probe lines in the log)"
            echo '```'
            echo
            echo "Merge to redeploy. If this PR is empty/absent, the chain was already current."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open PR if the chain changed
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: chore/refresh-free-models
          base: main
          commit-message: 'chore: refresh FREE_MODEL_CHAIN with currently-free, reachable models'
          title: 'chore: weekly free-model chain refresh'
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true

      # Runs only on a successful refresh. A failed refresh alerts through the
      # notify job below. Delivery is reported on its own line and never fails
      # the job, so a dead ntfy topic cannot mask a healthy refresh.
      - name: Notify success (ntfy)
        id: notify-success
        if: success()
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CHAIN_CHANGED: ${{ steps.chain.outputs.changed }}
          CHAIN_ADDED: ${{ steps.chain.outputs.added }}
          CHAIN_REMOVED: ${{ steps.chain.outputs.removed }}
          CHAIN: ${{ steps.chain.outputs.chain }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$NTFY_TOPIC" ]]; then
            echo "Notification delivery: skipped (NTFY_TOPIC not set)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! "$NTFY_TOPIC" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::warning::ntfy skipped: NTFY_TOPIC has characters outside [A-Za-z0-9_-]"
            echo "Notification delivery: failed (invalid topic)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$CHAIN_CHANGED" == "true" ]]; then
            title="Free-model chain CHANGED"
            priority=5
            tags="rotating_light"
            message="Added: ${CHAIN_ADDED:-none}
          Removed: ${CHAIN_REMOVED:-none}
          PR: #${PR_NUMBER:-unknown}
          Run: ${RUN_URL}"
          else
            title="Free-model refresh OK"
            priority=3
            tags="white_check_mark"
            message="Chain unchanged: ${CHAIN}
          Run: ${RUN_URL}"
          fi
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            --request POST --header "Title: ${title}" --header "Priority: ${priority}" \
            --header "Tags: ${tags}" --data-binary "$message" "https://ntfy.sh/${NTFY_TOPIC}" || echo "000")
          if [[ "$status" == "200" ]]; then
            echo "Notification delivery: ok (${title})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ntfy delivery failed (HTTP ${status}); the refresh itself succeeded"
            echo "Notification delivery: failed (HTTP ${status}, ${title})" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Notify on failure ──────────────────────────────────────────────────
  # This weekly cron has gone red on scheduled runs before with nothing
  # surfacing it (concept-free-tier-resilience: the probe can itself exhaust
  # a 50/day key, and a stale chain is a dead one). A failed *scheduled*
  # refresh means the chain is silently frozen — worth an issue.
  notify:
    name: Failure or recovery notification
    needs: [refresh]
    # Failures alert on manual runs too. Recovery notes only on the weekly run.
    if: always() && !cancelled() && (failure() || (github.event_name == 'schedule' && needs.refresh.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Update pipeline alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'recovery' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export ISSUE_TITLE="Weekly free-model chain refresh failed"
          export ISSUE_BODY="**Run:** ${RUN_URL}

          \`scripts/refresh-free-models.mjs\` exited non-zero (not exit 3, which is
          tolerated). \`FREE_MODEL_CHAIN\` was left untouched and may now be stale.
          Likely: OpenRouter catalog unreachable, too few probes passing, or the
          automation key itself rate-limited. Exit 4 means OpenRouter rejected
          the key (401/403): rotate OPENROUTER_API_KEY, then re-run."
          bash scripts/upsert-workflow-failure-issue.sh
