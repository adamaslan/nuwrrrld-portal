name: Refresh free model chain

# Weekly, plus manual trigger. Rewrites FREE_MODEL_CHAIN with models that are
# both $0-priced on OpenRouter and pass a live probe, then opens a PR if the
# list changed. Merge the PR to redeploy on Vercel.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Serialize the full run, including alerts, so failure/recovery cannot race.
concurrency:
  group: refresh-free-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Write scopes only on the job that opens the chain PR (zizmor excessive-permissions).
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh FREE_MODEL_CHAIN
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_CHAIN_SIZE: '4'
        # Exit 3 = the chain was refreshed fine but a SEAT_MODELS id is retired.
        # That is a degraded council, not a broken one, and it must NOT stop the
        # PR step below — a dead RISK seat blocking every weekly refresh is
        # exactly the failure this handling fixes (P1). Any other non-zero exit
        # (1 = catalog unreachable / too few working models) still fails the job.
        run: |
          set +e
          node scripts/refresh-free-models.mjs
          code=$?
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 3 ]; then
            echo "::warning title=SEAT_MODELS has a retired id::Chain refreshed; a seat model no longer exists. Repoint SEAT_MODELS in lib/openrouter.ts. Continuing so the chain PR still opens."
            exit 0
          fi
          if [ "$code" -eq 4 ]; then
            echo "::error title=OpenRouter key rejected::OPENROUTER_API_KEY was refused (401/403). Rotate the repo secret, then re-run. Chain left untouched."
            exit 4
          fi
          echo "::error title=refresh-free-models failed::Exited $code — chain left untouched."
          exit "$code"

      - name: Open PR if the chain changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: chore/refresh-free-models
          base: main
          commit-message: 'chore: refresh FREE_MODEL_CHAIN with currently-free, reachable models'
          title: 'chore: weekly free-model chain refresh'
          body: |
            Automated weekly refresh of `FREE_MODEL_CHAIN` in `lib/openrouter.ts`.

            Each listed model is both **$0-priced** on OpenRouter and passed a
            **live probe** (returned 200, not 402/429) at refresh time.

            Merge to redeploy. If this PR is empty/absent, the chain was already current.
          delete-branch: true

  # ── Notify on failure ──────────────────────────────────────────────────
  # This weekly cron has gone red on scheduled runs before with nothing
  # surfacing it (concept-free-tier-resilience: the probe can itself exhaust
  # a 50/day key, and a stale chain is a dead one). A failed *scheduled*
  # refresh means the chain is silently frozen — worth an issue.
  notify:
    name: Failure or recovery notification
    needs: [refresh]
    # Failures alert on manual runs too. Recovery notes only on the weekly run.
    if: always() && !cancelled() && (failure() || (github.event_name == 'schedule' && needs.refresh.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Update pipeline alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'recovery' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export ISSUE_TITLE="Weekly free-model chain refresh failed"
          export ISSUE_BODY="**Run:** ${RUN_URL}

          \`scripts/refresh-free-models.mjs\` exited non-zero (not exit 3, which is
          tolerated). \`FREE_MODEL_CHAIN\` was left untouched and may now be stale.
          Likely: OpenRouter catalog unreachable, too few probes passing, or the
          automation key itself rate-limited. Exit 4 means OpenRouter rejected
          the key (401/403): rotate OPENROUTER_API_KEY, then re-run."
          bash scripts/upsert-workflow-failure-issue.sh
