name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  db-schema-parity:
    # Phases 7-8 of docs/openrouter-migration-and-db-parity-plan.md. Needs
    # Node 22+ for node:sqlite (used by the SQLite half of the db-parity
    # suite), separate from the main `test` job's Node 20.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Check generated SQLite schema is up to date (Phase 7)
        run: npm run db:check-sqlite-schema

      - name: DB parity contract suite — SQLite (Phase 8)
        run: npm run test:db-parity
        # NEON_BRANCH_DATABASE_URL, when set as a repo secret, points this at
        # a throwaway Neon branch so the same suite also runs the Postgres
        # half (__tests__/db-parity/README.md). Unset is fine — that half is
        # skipped, not failed.
        #
        # The secret is only supplied on trusted refs (push, or a
        # pull_request whose head repo IS this repo) — never on a fork PR,
        # whose test code the PR author controls and could otherwise read the
        # env var back out. Falls through to an empty string on any other
        # ref, which the suite already treats identically to "unset".
        # CodeRabbit review, PR #105.
        env:
          DATABASE_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NEON_BRANCH_DATABASE_URL || '' }}

  shared-drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web (this repo)
        uses: actions/checkout@v4
        with:
          path: nuwrrrld-portal
          persist-credentials: false

      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          repository: adamaslan/gcp-expo1
          path: gcp3-mobile
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check shared-core drift
        working-directory: nuwrrrld-portal
        env:
          WEB_ROOT: .
          MOBILE_ROOT: ../gcp3-mobile
        run: node scripts/check-shared-drift.mjs
