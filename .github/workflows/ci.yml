name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  db-schema-parity:
    # Phases 7-8 of docs/openrouter-migration-and-db-parity-plan.md. Needs
    # Node 22+ for node:sqlite (used by the SQLite half of the db-parity
    # suite), separate from the main `test` job's Node 20.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Check generated SQLite schema is up to date (Phase 7)
        run: npm run db:check-sqlite-schema

      - name: DB parity contract suite — SQLite (Phase 8)
        run: npm run test:db-parity
        # NEON_BRANCH_DATABASE_URL, when set as a repo secret, points this at
        # a throwaway Neon branch so the same suite also runs the Postgres
        # half (__tests__/db-parity/README.md). Unset is fine — that half is
        # skipped, not failed.
        #
        # The secret is only supplied on trusted refs (push, or a
        # pull_request whose head repo IS this repo) — never on a fork PR,
        # whose test code the PR author controls and could otherwise read the
        # env var back out. Falls through to an empty string on any other
        # ref, which the suite already treats identically to "unset".
        # CodeRabbit review, PR #105.
        env:
          DATABASE_URL: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.NEON_BRANCH_DATABASE_URL || '' }}

  shared-drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web (this repo)
        uses: actions/checkout@v4
        with:
          path: nuwrrrld-portal
          persist-credentials: false

      - name: Checkout mobile
        uses: actions/checkout@v4
        with:
          repository: adamaslan/gcp-expo1
          path: gcp3-mobile
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check shared-core drift
        working-directory: nuwrrrld-portal
        env:
          WEB_ROOT: .
          MOBILE_ROOT: ../gcp3-mobile
        run: node scripts/check-shared-drift.mjs

  modal-python:
    # deploy/modal-backend (241 tests) and deploy/aws-modal-news (85) had no CI
    # at all (docs/gha-tests-and-cloud-parity.md §3.3 C). The DB tests need a
    # real Postgres; conftest.py creates and drops a throwaway database per run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['54329:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deploy/modal-backend/requirements*.txt

      # A CI runner, not a dev machine: the mamba-only rule doesn't apply here.
      - name: Install deps (mirrors modal_app.py's image; drift is a test failure)
        run: pip install -r deploy/modal-backend/requirements-dev.txt

      - name: modal-backend tests
        working-directory: deploy/modal-backend
        env:
          TEST_PG_ADMIN_URL: postgresql://postgres@localhost:54329/postgres
        run: pytest -q

      - name: aws-modal-news tests
        run: pytest -q deploy/aws-modal-news/tests

  workflow-lint:
    # §3.3 J: actionlint for syntax/expressions, zizmor for workflow security.
    # zizmor fails on high severity only; policy and suppressions live in
    # .github/zizmor.yml with a reason for each.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color -shellcheck=

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: zizmor
        run: |
          pip install 'zizmor~=1.30'
          zizmor --offline --min-severity high --config .github/zizmor.yml .github/
