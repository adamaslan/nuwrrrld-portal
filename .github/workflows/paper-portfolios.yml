name: Council Paper Portfolios (4x daily)

# GHA is the only scheduler. Trading slots refuse starts more than 30 minutes
# after their nominal time (gate.mjs TRADING_WINDOW_MINUTES), and each slot has
# several uncommon-minute entries so one late queue does not lose the slot.

on:
  schedule:
    # Local schedules follow DST without duplicate off-season gate runs.
    # Several entries per trading slot at uncommon minutes (see SLOT_BY_CRON in
    # .github/actions/market-gate/gate.mjs). Preclose trades stop at the 16:00
    # close, so its entries sit inside 15:45–16:00.
    # preopen 09:00 ET window
    - cron: '7 9 * * 1-5'
      timezone: America/New_York
    - cron: '17 9 * * 1-5'
      timezone: America/New_York
    - cron: '27 9 * * 1-5'
      timezone: America/New_York
    # midday 12:30 ET window
    - cron: '31 12 * * 1-5'
      timezone: America/New_York
    - cron: '41 12 * * 1-5'
      timezone: America/New_York
    - cron: '51 12 * * 1-5'
      timezone: America/New_York
    # preclose 15:45 ET window
    - cron: '47 15 * * 1-5'
      timezone: America/New_York
    - cron: '52 15 * * 1-5'
      timezone: America/New_York
    - cron: '57 15 * * 1-5'
      timezone: America/New_York
    # settle 16:30 ET — mark-to-market close, no trading
    - cron: '30 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (overrides wall-clock detection)'
        required: false
        type: choice
        options: [preopen, midday, preclose, settle]
      account:
        description: 'Restrict to one account (optional — default all 8)'
        required: false
        type: string
      skip_market_check:
        description: 'Legacy manual force override (weekday, holiday and slot window)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force a manual slot outside its calendar/window (operator override)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Gate, slot, secrets and deploy check only; no live_prices write, no paper orders'
        required: false
        type: boolean
        default: false

concurrency:
  group: paper-portfolios
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────
  gate:
    name: Market-hours gate + slot resolution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
      slot: ${{ steps.check.outputs.slot }}
      late: ${{ steps.check.outputs.late }}
      event_time: ${{ steps.event.outputs.result }}
      session_date: ${{ steps.session.outputs.session_date }}
    steps:
      # Sparse: only .github/ — the shared retry helper and market-gate action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Market gate regression tests
        run: node --test .github/actions/market-gate/*.test.mjs

      - id: event
        name: Preserve workflow event time
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            return data.created_at;
      - id: session
        name: Resolve intended settle session
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT_TIME: ${{ steps.event.outputs.result }}
        run: node .github/actions/market-gate/gate.mjs session

      - id: calendar
        name: NYSE calendar (holidays, early closes)
        uses: ./.github/actions/market-gate
        with:
          date: ${{ steps.session.outputs.session_date }}
          alpaca-key: ${{ secrets.ALPACA_API_KEY }}
          alpaca-secret: ${{ secrets.ALPACA_API_SECRET }}

      - id: check
        name: Resolve slot and refuse unsafe trading windows
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT_TIME: ${{ steps.event.outputs.result }}
          SLOT: ${{ inputs.slot }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || inputs.skip_market_check) }}
          CALENDAR_DAY: ${{ steps.calendar.outputs.is_trading_day }}
          CALENDAR_OPEN: ${{ steps.calendar.outputs.open }}
          CALENDAR_CLOSE: ${{ steps.calendar.outputs.close }}
          CALENDAR_LATEST_COMPLETED_SESSION: ${{ steps.calendar.outputs.latest_completed_session }}
        run: node .github/actions/market-gate/gate.mjs paper

  # ── Run ─────────────────────────────────────────────────────────────────
  run-slot:
    name: Run the paper-portfolio loop for the resolved slot
    needs: gate
    if: needs.gate.outputs.is_trading_day == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    outputs:
      run_status: ${{ steps.run.outputs.status }}
    steps:
      # `gh secret list` needs a token with secrets scope, which the default
      # GITHUB_TOKEN never has (HTTP 403 "Resource not accessible by
      # integration"), so the old check failed every run before the route was
      # called. Check the values the next steps actually receive instead.
      - name: Verify required secrets exist
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PAPER_CRON_SECRET: ${{ secrets.PAPER_CRON_SECRET }}
        run: |
          [ -n "$PORTAL_URL" ] || { echo "::error::PORTAL_URL secret missing"; exit 1; }
          [ -n "$PAPER_CRON_SECRET" ] || { echo "::error::PAPER_CRON_SECRET secret missing — see docs/paper-portfolios-remaining-todo.md Phase 4"; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployed policy version
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
        run: |
          curl -fsS --max-time 15 "$PORTAL_URL/api/paper/version" -o /tmp/paper-version.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { policyMatches } from './.github/actions/market-gate/gate.mjs';
          const expected = readFileSync('lib/shared/paper-policy.ts', 'utf8').match(/export const PAPER_POLICY_VERSION = ["']([^"']+)["']/)?.[1];
          if (!policyMatches(JSON.parse(readFileSync('/tmp/paper-version.json', 'utf8')), expected)) {
            console.error('Deployed paper policy does not match the checked-out policy; refusing the slot.');
            process.exit(1);
          }
          console.log('Deployed paper policy matches.');
          NODE

      - name: Refresh live_prices and require at least 95% coverage
        if: ${{ !inputs.dry_run }}
        timeout-minutes: 5
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_PUSH_SECRET: ${{ secrets.PORTAL_PUSH_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          set -euo pipefail
          # Capture the response privately; publish only the coverage decision.
          node scripts/push-alpaca-live-prices.mjs > /tmp/paper-prices.log 2>&1 || { echo "::error::Live-price refresh failed; refusing the slot."; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { priceCoverage } from './.github/actions/market-gate/gate.mjs';
          if (!priceCoverage(readFileSync('/tmp/paper-prices.log', 'utf8'))) {
            console.error('Live-price coverage below 95% or missing; refusing the slot.');
            process.exit(1);
          }
          console.log('Live-price coverage meets 95% floor.');
          NODE

      # Re-check after queuing, setup and refresh; the first gate may now be stale.
      - id: calendar
        uses: ./.github/actions/market-gate
        with:
          date: ${{ needs.gate.outputs.slot == 'settle' && needs.gate.outputs.session_date || '' }}
          alpaca-key: ${{ secrets.ALPACA_API_KEY }}
          alpaca-secret: ${{ secrets.ALPACA_API_SECRET }}
      - id: recheck
        name: Re-check slot immediately before POST
        env:
          FIRED_CRON: ${{ github.event.schedule }}
          EVENT_TIME: ${{ needs.gate.outputs.event_time }}
          SLOT: ${{ inputs.slot || needs.gate.outputs.slot }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && (inputs.force || inputs.skip_market_check) }}
          CALENDAR_DAY: ${{ steps.calendar.outputs.is_trading_day }}
          CALENDAR_OPEN: ${{ steps.calendar.outputs.open }}
          CALENDAR_CLOSE: ${{ steps.calendar.outputs.close }}
          CALENDAR_LATEST_COMPLETED_SESSION: ${{ steps.calendar.outputs.latest_completed_session }}
        run: node .github/actions/market-gate/gate.mjs paper

      - name: Run ${{ needs.gate.outputs.slot }} slot across all accounts
        id: run
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PAPER_CRON_SECRET: ${{ secrets.PAPER_CRON_SECRET }}
          SLOT: ${{ needs.gate.outputs.slot }}
          ACCOUNT: ${{ inputs.account }}
          SESSION_DATE: ${{ needs.gate.outputs.session_date }}
          RECHECK_ALLOWED: ${{ steps.recheck.outputs.is_trading_day }}
          RECHECK_REASON: ${{ steps.recheck.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$RECHECK_ALLOWED" != "true" ]]; then
            echo "::error::Paper slot refused by pre-POST re-check: $RECHECK_REASON. No POST was sent."
            exit 1
          fi
          URL="$PORTAL_URL/api/pipeline/paper-portfolios?slot=$SLOT"
          if [[ "$SLOT" == "settle" ]]; then
            URL="${URL}&trade_date=${SESSION_DATE}"
          fi
          if [[ -n "${ACCOUNT:-}" ]]; then
            URL="${URL}&account=${ACCOUNT}"
          fi
          if [[ "${{ steps.recheck.outputs.late }}" == "true" ]]; then
            URL="${URL}&late=true"
          fi
          if [[ "${{ inputs.dry_run || false }}" == "true" ]]; then
            # The route has no dry-run mode; stop before it. Everything up to
            # here (gate, slot, secrets, deploy check) has run for real.
            echo "status=dry-run" >> "$GITHUB_OUTPUT"
            echo "Dry run: would POST ${URL#"$PORTAL_URL"}"
            jq -n --arg slot "$SLOT" --arg url "${URL#"$PORTAL_URL"}" '{ok: true, dryRun: true, slot: $slot, wouldPost: $url}' > /tmp/paper-run.json
            exit 0
          fi
          STATUS=$(bash .github/scripts/portal-post.sh /tmp/paper-run.json "$URL" \
            -H "Authorization: Bearer $PAPER_CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --max-time 280)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "paper-portfolios HTTP $STATUS"
          jq . /tmp/paper-run.json 2>/dev/null || cat /tmp/paper-run.json
          if [[ "$STATUS" != 2* ]]; then
            echo "::error::paper-portfolios returned HTTP $STATUS for slot=$SLOT"
            exit 1
          fi

      - name: Sanity check — zero orders across all accounts
        if: steps.run.outputs.status == '200' && needs.gate.outputs.slot != 'settle'
        run: |
          # settle never trades (mark-to-market only), so this check is
          # meaningless there — every other slot writing zero orders across
          # all 8 accounts is unusual enough to flag, not to fail on (a quiet
          # market, or every account already at target, is a real outcome).
          ORDERS=$(jq -r '.meta.ordersTotal // 0' /tmp/paper-run.json 2>/dev/null || echo 0)
          SKIPPED=$(jq -r '[.results[]? | select(.status == "skipped")] | length' /tmp/paper-run.json 2>/dev/null || echo 0)
          echo "orders=$ORDERS skipped_accounts=$SKIPPED"
          if [[ "$ORDERS" == "0" && "$SKIPPED" == "0" ]]; then
            echo "::warning::Zero orders written across all 8 accounts for slot=${{ needs.gate.outputs.slot }}, and none were skipped — worth a look."
          fi

      - name: Write step summary
        if: always()
        env:
          ACCOUNT_FILTER: ${{ inputs.account || 'all 8' }}
        run: |
          {
            echo "## Paper portfolios — ${{ needs.gate.outputs.slot }} — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| slot | ${{ needs.gate.outputs.slot }} |"
            echo "| account filter | ${ACCOUNT_FILTER} |"
            echo "| dry run | ${{ inputs.dry_run || false }} |"
            echo "| run HTTP | ${{ steps.run.outputs.status || '—' }} |"
            if [[ -f /tmp/paper-run.json ]]; then
              echo ""
              echo '```json'
              jq '{ok, tradeDate, slot, orders: (.meta.ordersTotal // 0), errors: (.errors // [])}' \
                /tmp/paper-run.json 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolios-${{ needs.gate.outputs.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/paper-run.json
          retention-days: 30

  # ── Notify on failure ──────────────────────────────────────────────────
  notify:
    name: Failure or recovery notification
    needs: [gate, run-slot]
    if: always() && !cancelled() && (failure() || (needs.gate.result == 'success' && needs.run-slot.result == 'success' && inputs.dry_run != true && !inputs.account))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      # docs/paper-trading-v3.md F11/§5.2 item 5: every failure used to open a
      # brand-new issue, even when the previous one for the exact same slot
      # was still open from an hour ago — 35 open near-duplicate issues by
      # 2026-09-29, all the pre-#188 `gh secret list` defect. Comments on an
      # existing open issue for this slot instead of opening a new one.
      - uses: actions/checkout@v4

      - name: Update pipeline alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'recovery' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLOT="${{ needs.gate.outputs.slot || 'unresolved slot' }}"
          export ISSUE_TITLE="Paper portfolios (${SLOT}) failed"
          export ISSUE_BODY="**Run:** ${RUN_URL}

          **Slot:** ${{ needs.gate.outputs.slot || 'unresolved' }}
          **Run status:** ${{ needs.run-slot.outputs.run_status || 'did not reach run step' }}

          Likely cause if this is the first failure: \`PAPER_CRON_SECRET\` not yet
          set as a GitHub Actions secret, or \`paper_accounts\` still empty in the
          target DB — see docs/paper-portfolios-remaining-todo.md Phase 4."
          bash scripts/upsert-workflow-failure-issue.sh
