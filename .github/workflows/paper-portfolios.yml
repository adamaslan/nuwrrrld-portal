name: Council Paper Portfolios (4x daily)

# Runs the deterministic paper-trading loop (docs/council-paper-portfolios.md
# §4) across all 8 seat accounts, four times a trading day. Each of the four
# slots (preopen/midday/preclose/settle) gets its own EST+EDT cron pair, per
# §4.1's cadence table — both fire year-round and the gate below picks the
# slot whose NY-time *window* the wall clock falls in (not an exact-minute
# match — GHA scheduled runs start late often enough that exact matching left
# every recorded run skipped, see the gate step's own comment), so the
# off-season entry is a no-op rather than a duplicate run an hour apart (same
# convention as afternoon-pipeline.yml / track-followed-tickers.yml).
#
# `/api/pipeline/paper-portfolios` (Phase 3, PR #128) does the actual
# LOAD/MARK/SCREEN/RANK/PROPOSE/CLIP/FILL/PERSIST loop per account, with
# per-account try/catch so one account's failure doesn't abort the other
# seven. This workflow only gates on market hours, resolves which slot fired,
# calls that route once, and reports.
#
# MANUAL STEPS: PAPER_CRON_SECRET, PORTAL_PUSH_SECRET, ALPACA_API_KEY and
# ALPACA_API_SECRET must be GitHub Actions secrets (secrets-sync skill), and
# paper_accounts must be seeded (scripts/seed-paper-portfolios.mjs).
#
# docs/paper-trading-v3.md §5.2 fixes applied here:
#   1. The slot is resolved from which `github.event.schedule` cron actually
#      fired, not the wall clock at whatever time GHA got around to starting
#      the job — GHA commonly starts 30-90 min late, and the wall-clock gate
#      mislabeled 6 of 8 runs as `settle` on 2026-09-28 (F6). The original
#      wall-clock window logic is kept ONLY for a manual `workflow_dispatch`
#      with no `slot` input, where there is no cron event to read.
#   2. A trading slot that starts well outside its intended window (this
#      workflow, however triggered) still runs, but flags itself `late=true`
#      via the ?late= query param so the route can decide how to treat it
#      rather than silently trading at a stale mark.
#   3. Before calling the run route, poll GET /api/paper/version until its
#      `sha` matches this workflow's own `github.sha` — closes F2 (a run
#      executing 2 seconds after a merge finished, before the new deploy had
#      actually rolled out, and getting labeled with the new policy version
#      anyway).
#   4. The failure-issue step finds-or-comments on an existing open issue for
#      this failure signature instead of opening a new one every time (F11 —
#      35 open near-duplicate issues on 2026-09-29, all the same root cause).

on:
  schedule:
    # preopen 09:00 ET
    - cron: '0 14 * * 1-5'   # EST (UTC-5)
    - cron: '0 13 * * 1-5'   # EDT (UTC-4)
    # midday 12:30 ET
    - cron: '30 17 * * 1-5'  # EST
    - cron: '30 16 * * 1-5'  # EDT
    # preclose 15:45 ET
    - cron: '45 20 * * 1-5'  # EST
    - cron: '45 19 * * 1-5'  # EDT
    # settle 16:30 ET — mark-to-market close, no trading
    - cron: '30 21 * * 1-5'  # EST
    - cron: '30 20 * * 1-5'  # EDT
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (overrides wall-clock detection)'
        required: false
        type: choice
        options: [preopen, midday, preclose, settle]
      account:
        description: 'Restrict to one account (optional — default all 8)'
        required: false
        type: string
      skip_market_check:
        description: 'Skip weekday/market-hours gate'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Gate, slot, secrets and deploy check only; no live_prices write, no paper orders'
        required: false
        type: boolean
        default: false

concurrency:
  group: paper-portfolios
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────
  gate:
    name: Market-hours gate + slot resolution
    runs-on: ubuntu-latest
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
      slot: ${{ steps.check.outputs.slot }}
      late: ${{ steps.check.outputs.late }}
    steps:
      # Sparse: only .github/ — the shared retry helper and market-gate action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - id: calendar
        name: NYSE calendar (holidays, early closes)
        uses: ./.github/actions/market-gate
        with:
          alpaca-key: ${{ secrets.ALPACA_API_KEY }}
          alpaca-secret: ${{ secrets.ALPACA_API_SECRET }}

      - id: check
        name: Slot resolution (from the cron that fired) + weekday gate
        env:
          # github.event.schedule is only set on a `schedule` trigger; empty
          # on workflow_dispatch, which is exactly when the fallback below
          # (an explicit input, or the wall-clock window) is needed instead.
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          DAY=$(date -u +%u)   # 1=Mon … 7=Sun
          NY_TIME=$(TZ="America/New_York" date +%H:%M)
          NY_MIN=$(( 10#$(TZ="America/New_York" date +%H) * 60 + 10#$(TZ="America/New_York" date +%M) ))
          echo "NY local time: ${NY_TIME}"

          if [[ "$DAY" -ge 6 && "${{ inputs.skip_market_check }}" != "true" ]]; then
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "Weekend — skipping."
            exit 0
          fi

          # Weekday holidays passed the weekday-only gate (docs/gha-tests-and-cloud-parity.md §3.3 E).
          if [[ "${{ steps.calendar.outputs.is_trading_day }}" == "false" && "${{ inputs.skip_market_check }}" != "true" ]]; then
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "NYSE holiday per the Alpaca calendar — skipping."
            exit 0
          fi

          if [[ -n "${{ inputs.slot }}" ]]; then
            SLOT="${{ inputs.slot }}"
          elif [[ -n "$FIRED_CRON" ]]; then
            # docs/paper-trading-v3.md F6/§5.2 item 1: resolve from which cron
            # entry actually fired, not the wall clock at whenever GHA got
            # around to starting the job. GHA commonly starts 30-90 minutes
            # late, and the wall-clock window this replaced mislabeled 6 of 8
            # runs as `settle` on 2026-09-28 alone — every one of them fired
            # inside a *different* slot's own cron but landed after that
            # slot's window had already rolled into the next one.
            #
            # CodeRabbit review, PR #204: matching EITHER cron in a pair to
            # the same slot regardless of season reintroduced the exact bug
            # this fix was meant to close, in the other direction — every
            # slot would now fire TWICE a day (once at the correct NY time,
            # once an hour off), because both the EST and EDT cron for a slot
            # match year-round and there was nothing left to reject the
            # off-season one. `paper_runs`' idempotency absorbed the second
            # fire as `alreadyRan` rather than double-trading, but it still
            # doubled the GHA runs and API calls every slot, every day — the
            # exact "off-season entry is a no-op" behavior the original
            # wall-clock gate provided and this rewrite dropped. Fixed by
            # validating the cron against NY's *currently active* UTC offset:
            # only the cron matching today's real DST state resolves to a
            # slot; the other one now correctly falls through to SLOT="".
            NY_OFFSET=$(TZ="America/New_York" date +%z)  # "-0500" (EST) or "-0400" (EDT)
            case "$FIRED_CRON" in
              '0 14 * * 1-5')   [[ "$NY_OFFSET" == "-0500" ]] && SLOT="preopen"  ;;
              '0 13 * * 1-5')   [[ "$NY_OFFSET" == "-0400" ]] && SLOT="preopen"  ;;
              '30 17 * * 1-5')  [[ "$NY_OFFSET" == "-0500" ]] && SLOT="midday"   ;;
              '30 16 * * 1-5')  [[ "$NY_OFFSET" == "-0400" ]] && SLOT="midday"   ;;
              '45 20 * * 1-5')  [[ "$NY_OFFSET" == "-0500" ]] && SLOT="preclose" ;;
              '45 19 * * 1-5')  [[ "$NY_OFFSET" == "-0400" ]] && SLOT="preclose" ;;
              '30 21 * * 1-5')  [[ "$NY_OFFSET" == "-0500" ]] && SLOT="settle"   ;;
              '30 20 * * 1-5')  [[ "$NY_OFFSET" == "-0400" ]] && SLOT="settle"   ;;
              *) SLOT="" ;;
            esac
          else
            # Manual dispatch, no explicit slot — fall back to the wall-clock
            # window (unchanged from before this fix), since there is no cron
            # event to read. Each slot claims the window up to the next
            # slot's start; `settle` extends to end-of-day. Re-running the
            # same slot within its window is safe: the route's own
            # idempotency (unique constraint on paper_runs(account,
            # trade_date, slot) + an early getRun() check in
            # lib/paper-engine.ts::runAccountSlot) absorbs a duplicate
            # trigger without double-running.
            PREOPEN=$((9 * 60))
            MIDDAY=$((12 * 60 + 30))
            PRECLOSE=$((15 * 60 + 45))
            SETTLE=$((16 * 60 + 30))
            if   (( NY_MIN >= PREOPEN  && NY_MIN < MIDDAY   )); then SLOT="preopen"
            elif (( NY_MIN >= MIDDAY   && NY_MIN < PRECLOSE )); then SLOT="midday"
            elif (( NY_MIN >= PRECLOSE && NY_MIN < SETTLE   )); then SLOT="preclose"
            elif (( NY_MIN >= SETTLE   && NY_MIN < 24 * 60  )); then SLOT="settle"
            else SLOT=""
            fi
          fi

          if [[ -z "$SLOT" ]]; then
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "NY local time ${NY_TIME}, cron '${FIRED_CRON:-none}' matches no slot — off-season cron entry, skipping."
          else
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            echo "slot=${SLOT}" >> "$GITHUB_OUTPUT"
            echo "Resolved slot: ${SLOT} (from ${FIRED_CRON:+cron}${FIRED_CRON:-wall-clock/manual})"

            # docs/paper-trading-v3.md §5.2 item 2: a trading slot starting
            # well outside its own window (late GHA start, or a manual
            # dispatch at an odd hour) still runs, but is flagged so the
            # sanity-check step downstream reads a real trade as "late",
            # never as invisible.
            declare -A SLOT_START=( [preopen]=$((9*60)) [midday]=$((12*60+30)) [preclose]=$((15*60+45)) [settle]=$((16*60+30)) )
            START=${SLOT_START[$SLOT]}
            LATE_MINUTES=$(( NY_MIN - START ))
            # CodeRabbit review, PR #204: an explicit manual dispatch BEFORE a
            # slot's own start (e.g. "midday" fired at 09:00 ET) produced a
            # negative LATE_MINUTES, which is not > 60 and so was reported as
            # on-time — the opposite of what the comment above promises. Both
            # directions count as outside the intended window; only a
            # same-side-or-later dispatch within 60 minutes stays on-time.
            if (( LATE_MINUTES > 60 || LATE_MINUTES < 0 )); then
              echo "late=true" >> "$GITHUB_OUTPUT"
              echo "Slot '${SLOT}' is ${LATE_MINUTES} minutes from its intended start — flagging as outside the window."
            else
              echo "late=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # ── Run ─────────────────────────────────────────────────────────────────
  run-slot:
    name: Run the paper-portfolio loop for the resolved slot
    needs: gate
    if: needs.gate.outputs.is_trading_day == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    outputs:
      run_status: ${{ steps.run.outputs.status }}
    steps:
      # `gh secret list` needs a token with secrets scope, which the default
      # GITHUB_TOKEN never has (HTTP 403 "Resource not accessible by
      # integration"), so the old check failed every run before the route was
      # called. Check the values the next steps actually receive instead.
      - name: Verify required secrets exist
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PAPER_CRON_SECRET: ${{ secrets.PAPER_CRON_SECRET }}
        run: |
          [ -n "$PORTAL_URL" ] || { echo "::error::PORTAL_URL secret missing"; exit 1; }
          [ -n "$PAPER_CRON_SECRET" ] || { echo "::error::PAPER_CRON_SECRET secret missing — see docs/paper-portfolios-remaining-todo.md Phase 4"; exit 1; }

      # The engine only fills at a live_prices row and that table has no other
      # writer running. Non-fatal: a missing price already means "no trade", so a
      # price outage must not block the run's mark-to-market and reconcile.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # docs/paper-trading-v3.md F2/§5.2 item 3: a run must never execute
      # against a Vercel deployment that hasn't finished rolling out yet. On
      # 2026-09-29 the manual trigger for the first real v2 slot hit the
      # route 2 seconds after Vercel's build finished, not after the alias
      # had actually moved — every result that run produced matched v1's
      # thresholds while being stamped v2. Polls up to 5 minutes; on timeout,
      # proceeds anyway and records the mismatch (`::warning`) rather than
      # blocking every run on a slow or genuinely stuck deploy.
      - name: Wait for the deployed commit to match this run's commit
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            # A dry run writes nothing, and one dispatched from a branch can never
            # match prod's SHA — report the comparison instead of polling it.
            LIVE_SHA=$(curl -sS --max-time 10 "$PORTAL_URL/api/paper/version" | jq -r '.sha // empty')
            echo "Dry run: deployed=${LIVE_SHA:-unknown} run=${{ github.sha }} ($([[ "$LIVE_SHA" == "${{ github.sha }}" ]] && echo match || echo 'no match — a real run would wait, then fail'))."
            exit 0
          fi
          for i in $(seq 1 30); do
            LIVE_SHA=$(curl -sS --max-time 10 "$PORTAL_URL/api/paper/version" | jq -r '.sha // empty')
            if [[ "$LIVE_SHA" == "${{ github.sha }}" ]]; then
              echo "Deployed commit matches (${LIVE_SHA:0:7}) after $(( (i - 1) * 10 ))s."
              exit 0
            fi
            sleep 10
          done
          # CodeRabbit review, PR #204: this step exists specifically to
          # prevent a run executing against a still-rolling-out deploy (F2 —
          # the exact failure this poll was added to close). Warning and
          # proceeding anyway permits that failure whenever a deploy is
          # unusually slow or stuck; failing the job is the correct default
          # for a scheduled job that writes real (paper) capital state — an
          # operator can re-dispatch this exact slot once the deploy catches
          # up (paper_runs' idempotency makes that safe: a slot that never
          # ran has nothing to double-run).
          echo "::error::Deployed commit (${LIVE_SHA:-unknown}) still doesn't match ${{ github.sha }} after 5 minutes — refusing to run against a deploy that may not have finished rolling out. Re-dispatch this slot once the deploy is live."
          exit 1

      - name: Refresh live_prices from Alpaca (IEX latest trades)
        if: ${{ !inputs.dry_run }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_PUSH_SECRET: ${{ secrets.PORTAL_PUSH_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: node scripts/push-alpaca-live-prices.mjs

      - name: Run ${{ needs.gate.outputs.slot }} slot across all accounts
        id: run
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PAPER_CRON_SECRET: ${{ secrets.PAPER_CRON_SECRET }}
          SLOT: ${{ needs.gate.outputs.slot }}
          ACCOUNT: ${{ inputs.account }}
        run: |
          set -euo pipefail
          URL="$PORTAL_URL/api/pipeline/paper-portfolios?slot=$SLOT"
          if [[ -n "${ACCOUNT:-}" ]]; then
            URL="${URL}&account=${ACCOUNT}"
          fi
          if [[ "${{ needs.gate.outputs.late }}" == "true" ]]; then
            URL="${URL}&late=true"
          fi
          if [[ "${{ inputs.dry_run || false }}" == "true" ]]; then
            # The route has no dry-run mode; stop before it. Everything up to
            # here (gate, slot, secrets, deploy check) has run for real.
            echo "status=dry-run" >> "$GITHUB_OUTPUT"
            echo "Dry run: would POST ${URL#"$PORTAL_URL"}"
            jq -n --arg slot "$SLOT" --arg url "${URL#"$PORTAL_URL"}" '{ok: true, dryRun: true, slot: $slot, wouldPost: $url}' > /tmp/paper-run.json
            exit 0
          fi
          STATUS=$(bash .github/scripts/portal-post.sh /tmp/paper-run.json "$URL" \
            -H "Authorization: Bearer $PAPER_CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --max-time 280)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "paper-portfolios HTTP $STATUS"
          jq . /tmp/paper-run.json 2>/dev/null || cat /tmp/paper-run.json
          if [[ "$STATUS" != 2* ]]; then
            echo "::error::paper-portfolios returned HTTP $STATUS for slot=$SLOT"
            exit 1
          fi

      - name: Sanity check — zero orders across all accounts
        if: steps.run.outputs.status == '200' && needs.gate.outputs.slot != 'settle'
        run: |
          # settle never trades (mark-to-market only), so this check is
          # meaningless there — every other slot writing zero orders across
          # all 8 accounts is unusual enough to flag, not to fail on (a quiet
          # market, or every account already at target, is a real outcome).
          ORDERS=$(jq -r '.meta.ordersTotal // 0' /tmp/paper-run.json 2>/dev/null || echo 0)
          SKIPPED=$(jq -r '[.results[]? | select(.status == "skipped")] | length' /tmp/paper-run.json 2>/dev/null || echo 0)
          echo "orders=$ORDERS skipped_accounts=$SKIPPED"
          if [[ "$ORDERS" == "0" && "$SKIPPED" == "0" ]]; then
            echo "::warning::Zero orders written across all 8 accounts for slot=${{ needs.gate.outputs.slot }}, and none were skipped — worth a look."
          fi

      - name: Write step summary
        if: always()
        env:
          ACCOUNT_FILTER: ${{ inputs.account || 'all 8' }}
        run: |
          {
            echo "## Paper portfolios — ${{ needs.gate.outputs.slot }} — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| slot | ${{ needs.gate.outputs.slot }} |"
            echo "| account filter | ${ACCOUNT_FILTER} |"
            echo "| dry run | ${{ inputs.dry_run || false }} |"
            echo "| run HTTP | ${{ steps.run.outputs.status || '—' }} |"
            if [[ -f /tmp/paper-run.json ]]; then
              echo ""
              echo '```json'
              jq '{ok, tradeDate, slot, orders: (.meta.ordersTotal // 0), errors: (.errors // [])}' \
                /tmp/paper-run.json 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-portfolios-${{ needs.gate.outputs.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/paper-run.json
          retention-days: 30

  # ── Notify on failure ──────────────────────────────────────────────────
  notify:
    name: Failure notification
    needs: [gate, run-slot]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # docs/paper-trading-v3.md F11/§5.2 item 5: every failure used to open a
      # brand-new issue, even when the previous one for the exact same slot
      # was still open from an hour ago — 35 open near-duplicate issues by
      # 2026-09-29, all the pre-#188 `gh secret list` defect. Comments on an
      # existing open issue for this slot instead of opening a new one.
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLOT="${{ needs.gate.outputs.slot || 'unresolved slot' }}"
          BODY="**Run:** ${RUN_URL}

          **Slot:** ${{ needs.gate.outputs.slot || 'unresolved' }}
          **Run status:** ${{ needs.run-slot.outputs.run_status || 'did not reach run step' }}

          Likely cause if this is the first failure: \`PAPER_CRON_SECRET\` not yet
          set as a GitHub Actions secret, or \`paper_accounts\` still empty in the
          target DB — see docs/paper-portfolios-remaining-todo.md Phase 4."

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --label "pipeline-failure" \
            --state open --search "\"Paper portfolios ($SLOT)\" in:title" \
            --json number --jq '.[0].number')

          if [[ -n "$EXISTING" ]]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "Failed again:

          $BODY"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "Paper portfolios (${SLOT}) failed $(date -u '+%Y-%m-%d')" \
              --body "$BODY" \
              --label "pipeline-failure"
          fi
