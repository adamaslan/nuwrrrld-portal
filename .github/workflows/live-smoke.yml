name: Live model-chain smoke

# The only tests that touch real LLM providers (__tests__/live) never ran
# unattended (docs/gha-tests-and-cloud-parity.md §3.3 K). This runs the cheap
# one weekly: FREE_MODEL_CHAIN reachability, every council seat answering, and
# the fetchWithModelFallback path. Every chain entry is a $0 free-tier id, and
# one of the tests asserts exactly that.
#
# It also runs on PRs that change the chain or these tests, so a chain edit is
# checked against live providers before it merges.

on:
  schedule:
    - cron: '35 7 * * 1'   # Mondays 07:35 UTC, after refresh-free-models (06:17)
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - lib/openrouter.ts
      - __tests__/live/**
      - test/live-setup.ts
      - .github/workflows/live-smoke.yml

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  model-chain:
    # Fork PRs get no secrets; skip rather than fail on a missing key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Without a key every describeLive block skips and vitest reports green.
      # A smoke test that can't run must say so, not pass.
      - name: Require OPENROUTER_API_KEY
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: '[ -n "$OPENROUTER_API_KEY" ] || { echo "::error::OPENROUTER_API_KEY secret missing — live tests would silently skip"; exit 1; }'

      - name: Live model-chain tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx vitest run --project live __tests__/live/model-chain.live.test.ts
