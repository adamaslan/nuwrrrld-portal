name: Track Followed Tickers (daily)

# Every trading day, run this month's followed cohort (the 20 tickers frozen by
# select-followed-tickers.yml) through the three analysis features the product
# already has — backtest hit-rates, the live signal, and an AI-council verdict
# — and append the day's readings to docs/tickers-followed.md.
#
# Pattern copied from afternoon-pipeline.yml (see
# docs/wiki-portal/decision-afternoon-pipeline-cron-split.md): market-hours
# gate on the New York weekday and confirmed session close; the timezone-aware
# schedule runs at 4:30 PM New York time across daylight saving changes,
# workflow_dispatch with dry_run, secret verification, concurrency guard, step
# summary, artifact upload, failure issue.
#

on:
  schedule:
    # 4:30 PM New York time — post-close backup
    - cron: '30 16 * * 1-5'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      skip_market_check:
        description: 'Skip weekday/market-hours gate'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Log readings but do not persist writes'
        required: false
        type: boolean
        default: false

concurrency:
  group: track-followed-tickers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Gate ────────────────────────────────────────────────────────────────
  gate:
    name: Market-hours gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      # Sparse: only .github/ — the shared retry helper and market-gate action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - id: calendar
        name: NYSE calendar (holidays, early closes)
        uses: ./.github/actions/market-gate
        with:
          alpaca-key: ${{ secrets.ALPACA_API_KEY }}
          alpaca-secret: ${{ secrets.ALPACA_API_SECRET }}

      - id: check
        name: New York weekday, scheduled cron, and session-close check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FIRED_CRON: ${{ github.event.schedule }}
          SKIP_MARKET_CHECK: ${{ inputs.skip_market_check }}
          CALENDAR_TRADING_DAY: ${{ steps.calendar.outputs.is_trading_day }}
          SESSION_CLOSE: ${{ steps.calendar.outputs.close }}
        run: |
          set -euo pipefail
          DAY=$(TZ=America/New_York date +%u)
          NY_TIME=$(TZ=America/New_York date +%H:%M)
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_MARKET_CHECK" == "true" ]]; then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DAY" -ge 6 || "$CALENDAR_TRADING_DAY" != "true" ]]; then
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "Not a confirmed NYSE trading weekday — skipping."
            exit 0
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$FIRED_CRON" in
              '30 16 * * 1-5') ;;
              *)
                echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
                echo "Unexpected cron entry — skipping."
                exit 0
                ;;
            esac
          fi
          if [[ -z "$SESSION_CLOSE" || "$NY_TIME" < "$SESSION_CLOSE" ]]; then
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
            echo "Before the confirmed session close — skipping."
          else
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Track ───────────────────────────────────────────────────────────────
  track:
    name: Score the cohort through backtest + signal + council
    needs: gate
    if: needs.gate.outputs.is_trading_day == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
    outputs:
      track_status: ${{ steps.track.outputs.status }}
    steps:
      # Sparse: only .github/ — the shared retry helper and market-gate action.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Verify required secrets exist
        # The secrets API needs a token with secrets scope; the default
        # GITHUB_TOKEN gets HTTP 403, so check the values this job receives.
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$PORTAL_URL" ] || { echo "::error::PORTAL_URL secret missing"; exit 1; }
          [ -n "$CRON_SECRET" ] || { echo "::error::CRON_SECRET secret missing"; exit 1; }

      - name: Run the daily cohort scoring
        id: track
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          # The route reads this month's cohort from docs/tickers-followed.md
          # (or its own store) and, per ticker, calls fetchBacktest + re-reads
          # the ranked card + runs one grounded council seat, then writes the
          # four columns back into the doc.
          STATUS=$(bash .github/scripts/portal-post.sh /tmp/track.json "$PORTAL_URL/api/pipeline/followed-tickers" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H 'Content-Type: application/json' \
            --max-time 600 \
            -d "{\"dry_run\": ${{ inputs.dry_run || false }}, \"session\": \"followed-daily\"}")
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "track HTTP $STATUS"
          jq . /tmp/track.json 2>/dev/null || cat /tmp/track.json
          if [[ "$STATUS" != 2* ]]; then
            echo "::error::followed-tickers returned HTTP $STATUS (route not built yet — see docs/tickers-followed.md)"
            exit 1
          fi

      - name: Thesis-flip check
        id: flips
        if: steps.track.outputs.status == '200'
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # A cohort where every council verdict came back 'neutral' means the
          # grounded call degraded to a non-answer for the whole list — the
          # same uniform-output regression class as issue #12. Warn loudly;
          # do not fail the run (the backtest + signal columns are still real).
          # Route emits camelCase `thesisHolding`; the old snake_case key never matched.
          FLIPPED=$(jq -r '[.readings[]? | select(.thesisHolding == false)] | length' /tmp/track.json 2>/dev/null || echo 0)
          NEUTRAL=$(jq -r '[.readings[]? | select(.council.direction == "neutral")] | length' /tmp/track.json 2>/dev/null || echo 0)
          TOTAL=$(jq -r '(.readings // []) | length' /tmp/track.json 2>/dev/null || echo 0)
          echo "flipped=$FLIPPED neutral=$NEUTRAL total=$TOTAL"
          if [[ "$TOTAL" -gt 0 && "$NEUTRAL" == "$TOTAL" ]]; then
            echo "::warning::All ${TOTAL} council verdicts came back neutral — grounded call likely degraded for the whole cohort."
          fi
          echo "flipped=$FLIPPED" >> "$GITHUB_OUTPUT"

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Followed-tickers daily tracking — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| track HTTP | ${{ steps.track.outputs.status || '—' }} |"
            echo "| theses flipped today | ${{ steps.flips.outputs.flipped || '—' }} |"
            echo "| dry_run | ${{ inputs.dry_run || false }} |"
            if [[ -f /tmp/track.json ]]; then
              echo ""
              echo '```json'
              jq '{scored: (.readings // [] | length), degraded: .meta.degraded, backtest_engine: .meta.backtest_available}' \
                /tmp/track.json 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tracking artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: followed-tickers-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/track.json
          retention-days: 30

  # ── Notify on failure ──────────────────────────────────────────────────
  notify:
    name: Failure or recovery notification
    needs: [gate, track]
    if: always() && !cancelled() && (failure() || (needs.gate.result == 'success' && needs.track.result == 'success' && inputs.dry_run != true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Update pipeline alert
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_MODE: ${{ contains(needs.*.result, 'failure') && 'failure' || 'recovery' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          export RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export ISSUE_TITLE="Followed-tickers daily tracking failed"
          export ISSUE_BODY="**Run:** ${RUN_URL}

          **Track:** ${{ needs.track.outputs.track_status || 'skipped' }}

          Expected while \`/api/pipeline/followed-tickers\` is unbuilt — see docs/tickers-followed.md."
          bash scripts/upsert-workflow-failure-issue.sh
